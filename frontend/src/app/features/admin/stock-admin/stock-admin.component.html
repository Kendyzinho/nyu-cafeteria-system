<div class="container mt-4">
  <h2>Gestión de Stock</h2>
  <p class="text-muted">Administrador de productos disponibles en cafetería</p>

  <p *ngIf="cargando" class="text-muted">Cargando...</p>

  <table *ngIf="!cargando" class="table table-bordered table-hover mt-3">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Categoría</th>
        <th>Cantidad</th>
        <th>Umbral mínimo</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let producto of productos">
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.categoria }}</td>

        <td>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="producto.cantidad"
            min="0"
          />
        </td>

        <td>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="producto.umbralMinimo"
            min="0"
          />
        </td>

        <td>
          <span class="badge" [ngClass]="estadoBadge(producto).clase">
            {{ estadoBadge(producto).texto }}
          </span>
        </td>

        <td>
          <button
            class="btn btn-coffee"
            (click)="actualizarStock(producto)"
          >
            Guardar
          </button>
        </td>
      </tr>

      <tr *ngIf="productos.length === 0">
        <td colspan="6" class="text-center text-muted">No hay productos en stock</td>
      </tr>
    </tbody>
  </table>
</div>
