<div class="card h-100 border-0 shadow-sm card-menu" [ngClass]="{'opacity-75': item.stock === 0}">
  <img [src]="item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=300&q=80'" class="card-img-top img-menu" [alt]="item.name" style="height: 180px; object-fit: cover;">
  
  <div class="ribbon-wrapper" *ngIf="item.stock === 0">
    <div class="ribbon">AGOTADO</div>
  </div>

  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="badge bg-cafe-light">{{ item.category }}</span>
      <span class="badge bg-warning text-dark" *ngIf="item.stock > 0 && item.stock <= 5">¡Quedan {{ item.stock }}!</span>
    </div>
    <h5 class="fw-bold mb-1" style="color: #4E342E;">
      {{ item.name }}
      <span *ngIf="item.isDailyMenu" class="badge bg-success ms-1">Menú del Día</span>
    </h5>
    <p class="text-muted small mb-3 flex-grow-1">{{ item.description }}</p>
    
    <div class="d-flex justify-content-between align-items-end mb-3">
      <div>
        <div class="text-decoration-line-through text-muted small">Regular: ${{ item.price }}</div>
        <div class="fs-5 fw-bold" style="color: #6F4E37;">
          ${{ item.studentPrice }} <span class="fs-6 text-muted fw-normal">(Estudiante)</span>
        </div>
      </div>
    </div>

    <button 
      class="btn w-100 fw-bold" 
      [ngClass]="item.stock > 0 ? 'btn-cafeteria' : 'btn-secondary'"
      [disabled]="item.stock === 0"
      (click)="onAddToCart()">
      {{ item.stock > 0 ? '+ Agregar a mi pedido' : 'Sin Stock' }}
    </button>
  </div>
</div>
