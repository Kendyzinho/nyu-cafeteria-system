<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
  <div *ngFor="let t of toasts" class="toast show align-items-center text-white border-0 mb-2 shadow-lg" [ngClass]="'bg-' + t.type" role="alert" aria-live="assertive" aria-atomic="true" style="border-radius: 8px;">
    <div class="d-flex">
      <div class="toast-body fw-bold d-flex align-items-center gap-2">
        <svg *ngIf="t.type === 'success'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
        </svg>
        <svg *ngIf="t.type === 'danger' || t.type === 'warning'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
          <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        {{ t.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="remove(t)" aria-label="Close"></button>
    </div>
  </div>
</div>
