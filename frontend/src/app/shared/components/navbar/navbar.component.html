<header>
  <div style="background-color: var(--nyu-primary-dark); padding: 15px 0;">
    <div class="container d-flex justify-content-between align-items-center">

      <a routerLink="/home" class="text-white text-decoration-none d-flex align-items-center">
        <h1 class="fw-bold mb-0 me-3" style="letter-spacing: 1px; border-bottom: 3px solid white;">CAFETERIA NYU</h1>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </a>

      <div class="d-flex align-items-center text-white" *ngIf="currentUser">

        <!-- Contenedor Dropdown -->
        <div class="dropdown me-3">
          <div class="bg-white fw-bold d-flex justify-content-center align-items-center"
            style="color: var(--nyu-primary); width: 45px; height: 45px; border-radius: 8px; font-size: 1.2rem; cursor: pointer;"
            data-bs-toggle="dropdown" aria-expanded="false">
            {{ initials }}
          </div>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><a class="dropdown-item" routerLink="/profile">Mi Perfil</a></li>
            <li *ngIf="currentUser.role === 'Administrador'"><a class="dropdown-item" routerLink="/admin/users">Gestión
                de Usuarios</a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><button class="dropdown-item text-danger fw-bold" (click)="logout()">Cerrar Sesión</button></li>
          </ul>
        </div>

        <div class="lh-sm">
          <div class="fw-bold">{{ currentUser.firstName }} {{ currentUser.lastName }}</div>
          <small class="text-light opacity-75">(Estudiante Activo, {{ currentUser.isResident ? 'Residente' : 'Regular'
            }})</small>
        </div>
        <div class="ms-3 rounded-circle bg-success" style="width: 15px; height: 15px;"></div>
      </div>

    </div>
  </div>

  <div style="background-color: var(--nyu-primary); padding: 15px 0;">
    <div class="container d-flex justify-content-between align-items-center">

      <div class="d-flex gap-3">
        <a routerLink="/home" routerLinkActive="active-nav-link" class="btn text-white fw-bold border-0 px-3"
          style="border-radius: 8px; transition: all 0.2s;">Inicio</a>
        <a routerLink="/menu" routerLinkActive="active-nav-link" class="btn text-white fw-bold border-0 px-3"
          style="border-radius: 8px; transition: all 0.2s;">Menú del día</a>
        <a routerLink="/resident-plan" routerLinkActive="active-nav-link" class="btn text-white fw-bold border-0 px-3" style="border-radius: 8px; transition: all 0.2s;">Mi Plan</a>
        <a routerLink="/history" routerLinkActive="active-nav-link" class="btn text-white fw-bold border-0 px-3"
          style="border-radius: 8px; transition: all 0.2s;">Historial de Consumo</a>
      </div>

      <a routerLink="/checkout" class="btn bg-white fw-bold d-flex align-items-center gap-2 shadow-sm"
        style="border-radius: 8px; color: var(--nyu-primary);">
        <span class="fs-5 d-flex align-items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart3 me-2"
            viewBox="0 0 16 16">
            <path
              d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
          </svg>
        </span> (3) Artículos
      </a>

    </div>
  </div>
</header>
